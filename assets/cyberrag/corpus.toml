[[entradas]]
id = "path_traversal"
classe = "path_traversal"
cwe = "CWE-22"
titulo = "Leitura de arquivos fora do diretório previsto"
descricao = "Sequências com pontos e barras fazem o caminho montado a partir da entrada escapar do diretório esperado e alcançar configuração, chaves e dados de outros usuários. O servidor entrega o arquivo com as permissões do próprio processo, então o limite do diretório público deixa de existir."
padrao_seguro = "Não aceitar caminho vindo do cliente: usar um identificador lógico e resolver o arquivo no servidor contra uma lista de itens permitidos. Se o nome for inevitável, normalizar o caminho e confirmar que ele permanece dentro do diretório base."
referencias = ["CWE-22", "OWASP Path Traversal"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
@app.get("/arquivos")
def baixar():
    nome = request.args.get("nome", "")
    return send_file(os.path.join(BASE, nome))
"""
corrigido = """
NOMES_PERMITIDOS = {"resumo.pdf", "detalhe.csv"}

@app.get("/arquivos")
def baixar():
    nome = request.args.get("nome", "")
    if nome not in NOMES_PERMITIDOS:
        abort(404)
    return send_file(os.path.join(BASE, nome))
"""

[[entradas.exemplos]]
linguagem = "java"
vulneravel = """
public String abre(String relatorio) throws IOException {
    Path caminho = Paths.get("/var/dados", relatorio);
    return Files.readString(caminho);
}
"""
corrigido = """
private static final Set<String> PERMITIDOS = Set.of("resumo.pdf", "detalhe.csv");

public String abre(String relatorio) throws IOException {
    Path base = Paths.get("/var/dados").toRealPath();
    Path caminho = base.resolve(relatorio).normalize();
    if (!PERMITIDOS.contains(relatorio) || !caminho.startsWith(base)) {
        throw new IllegalArgumentException("arquivo nao permitido");
    }
    return Files.readString(caminho);
}
"""

[[entradas]]
id = "injecao_comando"
classe = "injecao_comando"
cwe = "CWE-78"
titulo = "Execução de comandos do sistema via interpretador de shell"
descricao = "Ao entregar entrada do usuário a um interpretador de shell, metacaracteres como ponto e vírgula e pipe passam a ser interpretados e executam instruções adicionais. O efeito é a execução de comandos com os privilégios do serviço, muito além da ação original prevista."
padrao_seguro = "Chamar o programa diretamente, sem shell, passando argumentos como lista, e validar cada argumento contra uma lista permitida. A linha de comando nunca deve ser montada por concatenação de texto."
referencias = ["CWE-78", "OWASP OS Command Injection Defense Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
@app.post("/ping")
def ping():
    host = request.form["host"]
    return os.popen("ping -c 1 " + host).read()
"""
corrigido = """
HOSTS_PERMITIDOS = {"10.0.0.10", "10.0.0.11"}

@app.post("/ping")
def ping():
    host = request.form["host"]
    if host not in HOSTS_PERMITIDOS:
        abort(400)
    return subprocess.run(["ping", "-c", "1", host], capture_output=True, text=True).stdout
"""

[[entradas.exemplos]]
linguagem = "javascript"
vulneravel = """
const { exec } = require("child_process");

app.get("/backup", (req, res) => {
  exec("tar -czf /tmp/backup.tgz " + req.query.diretorio, (erro, saida) => res.send(saida));
});
"""
corrigido = """
const { execFile } = require("child_process");

app.get("/backup", (req, res) => {
  const diretorio = req.query.diretorio;
  if (!/^[a-z0-9_-]+$/.test(diretorio)) return res.status(400).end();
  execFile("tar", ["-czf", "/tmp/backup.tgz", diretorio], (erro, saida) => res.send(saida));
});
"""

[[entradas]]
id = "ssrf"
classe = "ssrf"
cwe = "CWE-918"
titulo = "Requisição do servidor para destino controlado pelo atacante"
descricao = "A aplicação busca uma URL informada pelo usuário, mas a requisição sai do servidor e alcança endereços que o visitante não acessaria, como serviços internos e endpoints de metadados de nuvem. O atacante usa a aplicação como intermediária confiável para mapear e explorar a rede interna."
padrao_seguro = "Restringir os destinos a uma lista fixa de hosts e esquemas permitidos e, quando o domínio for realmente livre, resolver o nome e bloquear loopback, faixas internas e endereços de metadados antes de conectar."
referencias = ["CWE-918", "OWASP SSRF Prevention Cheat Sheet"]

[[entradas.exemplos]]
