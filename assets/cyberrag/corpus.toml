@app.post("/importar")
def importar():
    dados = pickle.loads(request.data)
    return {"itens": len(dados)}
"""
corrigido = """
import json

@app.post("/importar")
def importar():
    dados = json.loads(request.data)
    if not isinstance(dados, list):
        abort(400)
    return {"itens": len(dados)}
"""

[[entradas.exemplos]]
linguagem = "java"
vulneravel = """
public Preferencias carrega(InputStream corpo) throws Exception {
    try (ObjectInputStream fluxo = new ObjectInputStream(corpo)) {
        return (Preferencias) fluxo.readObject();
    }
}
"""
corrigido = """
private static final ObjectInputFilter FILTRO = info -> {
    Class<?> classe = info.serialClass();
    if (classe == null) return ObjectInputFilter.Status.UNDECIDED;
    return classe == Preferencias.class ? ObjectInputFilter.Status.ALLOWED
                                        : ObjectInputFilter.Status.REJECTED;
};

public Preferencias carrega(InputStream corpo) throws Exception {
    try (ObjectInputStream fluxo = new ObjectInputStream(corpo)) {
        fluxo.setObjectInputFilter(FILTRO);
        return (Preferencias) fluxo.readObject();
    }
}
"""

[[entradas]]
id = "xxe"
classe = "xxe"
cwe = "CWE-611"
titulo = "Entidades externas resolvidas pelo parser XML"
descricao = "Um parser XML configurado para resolver entidades externas lê arquivos locais ou busca URLs indicadas no próprio documento enviado. O XML vira um caminho de leitura de arquivos e de requisições disparadas pelo servidor, inclusive contra a rede interna."
padrao_seguro = "Desativar a resolução de entidades externas, o acesso à rede e a validação de DTD no parser, aceitando apenas o subconjunto de XML necessário. Manter a biblioteca de parsing atualizada e restringir o tamanho do documento."
referencias = ["CWE-611", "OWASP XML External Entity Prevention Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
from lxml import etree

@app.post("/nota")
def nota():
    arvore = etree.parse(request.stream)
    return {"numero": arvore.findtext("numero")}
"""
corrigido = """
from lxml import etree

PARSER_SEGURO = etree.XMLParser(resolve_entities=False, no_network=True, load_dtd=False)

@app.post("/nota")
def nota():
    arvore = etree.parse(request.stream, PARSER_SEGURO)
    return {"numero": arvore.findtext("numero")}
"""

[[entradas.exemplos]]
linguagem = "java"
vulneravel = """
DocumentBuilderFactory fabrica = DocumentBuilderFactory.newInstance();
Document documento = fabrica.newDocumentBuilder().parse(corpo);
return documento.getElementsByTagName("numero").item(0).getTextContent();
"""
corrigido = """
DocumentBuilderFactory fabrica = DocumentBuilderFactory.newInstance();
fabrica.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
fabrica.setXIncludeAware(false);
fabrica.setExpandEntityReferences(false);
Document documento = fabrica.newDocumentBuilder().parse(corpo);
return documento.getElementsByTagName("numero").item(0).getTextContent();
"""

[[entradas]]
id = "csrf"
classe = "csrf"
cwe = "CWE-352"
titulo = "Ação autenticada disparada por outra origem"
descricao = "O navegador envia os cookies do site automaticamente, então uma página de terceiros consegue disparar operações autenticadas sem o usuário perceber. O alvo é a confiança que o servidor deposita na requisição apenas por ela carregar a sessão da vítima."
padrao_seguro = "Exigir em toda requisição que altera estado um token imprevisível, vinculado à sessão e não recuperável por outra origem, comparado com tempo constante. Marcar o cookie de sessão como SameSite reduz o vetor, mas não dispensa o token."
referencias = ["CWE-352", "OWASP Cross-Site Request Forgery Prevention Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
@app.post("/conta/email")
def atualiza_email():
    usuario = sessao_atual()
    usuario.email = request.form["email"]
    db.session.commit()
    return redirect("/conta")
"""
corrigido = """
@app.post("/conta/email")
def atualiza_email():
    enviado = request.form.get("csrf_token", "")
    if not secrets.compare_digest(enviado, session["csrf_token"]):
        abort(403)
    usuario = sessao_atual()
    usuario.email = request.form["email"]
    db.session.commit()
    return redirect("/conta")
"""

[[entradas.exemplos]]
