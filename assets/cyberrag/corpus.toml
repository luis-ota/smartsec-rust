[[entradas]]
id = "credencial_hardcoded"
classe = "credencial_hardcoded"
cwe = "CWE-798"
titulo = "Credencial de acesso embutida no código-fonte"
descricao = "Senhas, tokens e chaves fixados no código continuam válidos depois do deploy e acabam copiados para repositórios, artefatos de build e backups, onde ficam visíveis para qualquer leitor. Como não passam por rotação nem por controle de acesso, o vazamento exige recompilar ou reeditar o sistema e, mesmo assim, mantém o acesso ativo."
padrao_seguro = "Carregar o segredo em tempo de execução a partir de variável de ambiente ou de um cofre de segredos, mantendo o arquivo de configuração local fora do versionamento e com rotação prevista. O valor nunca deve aparecer em log, mensagem de erro ou código de teste."
referencias = ["CWE-798", "OWASP Secrets Management Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
import requests

TOKEN_API = "token-exemplo-nao-real"

def sincroniza():
    return requests.get("https://api.interna.local/dados", headers={"Authorization": TOKEN_API})
"""
corrigido = """
import os
import requests

def sincroniza():
    token = os.environ["TOKEN_API"]
    return requests.get("https://api.interna.local/dados", headers={"Authorization": token})
"""

[[entradas.exemplos]]
linguagem = "javascript"
vulneravel = """
const jwt = require("jsonwebtoken");

const CHAVE_ASSINATURA = "segredo-exemplo-123";

function geraToken(usuario) {
  return jwt.sign({ sub: usuario.id }, CHAVE_ASSINATURA);
}
"""
corrigido = """
const jwt = require("jsonwebtoken");

function geraToken(usuario) {
  return jwt.sign({ sub: usuario.id }, process.env.CHAVE_ASSINATURA);
}
"""

[[entradas]]
id = "injecao_sql"
classe = "injecao_sql"
cwe = "CWE-89"
titulo = "Injeção de SQL por concatenação de entrada"
descricao = "Montar a consulta por concatenação faz a entrada do usuário virar parte da sintaxe SQL, permitindo alterar o comando, ler outras tabelas e modificar dados. O problema não está no valor recebido, e sim na mistura entre dado e instrução dentro da mesma string."
padrao_seguro = "Enviar a consulta com marcadores de posição e passar os valores separadamente, deixando o driver tratar o dado apenas como valor. Quando a entrada define identificador de coluna ou tabela, comparar com uma lista fixa de opções permitidas."
referencias = ["CWE-89", "OWASP SQL Injection Prevention Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
def busca_usuario(cursor, nome):
    consulta = "SELECT id, nome FROM usuarios WHERE nome = '" + nome + "'"
    cursor.execute(consulta)
    return cursor.fetchall()
"""
corrigido = """
def busca_usuario(cursor, nome):
    consulta = "SELECT id, nome FROM usuarios WHERE nome = %s"
    cursor.execute(consulta, (nome,))
    return cursor.fetchall()
"""

[[entradas.exemplos]]
linguagem = "java"
vulneravel = """
public String buscaMatricula(String nome, Statement st) throws SQLException {
    String sql = "SELECT matricula FROM usuarios WHERE nome = '" + nome + "'";
    try (ResultSet rs = st.executeQuery(sql)) {
        return rs.next() ? rs.getString(1) : null;
    }
}
"""
corrigido = """
public String buscaMatricula(String nome, Connection con) throws SQLException {
    String sql = "SELECT matricula FROM usuarios WHERE nome = ?";
    try (PreparedStatement ps = con.prepareStatement(sql)) {
        ps.setString(1, nome);
        try (ResultSet rs = ps.executeQuery()) {
            return rs.next() ? rs.getString(1) : null;
        }
    }
}
"""

[[entradas]]
id = "xss"
classe = "xss"
cwe = "CWE-79"
titulo = "Execução de script injetado na página da vítima"
descricao = "Quando dados controlados pelo usuário entram na página sem tratamento, o navegador executa o script embutido naquele conteúdo, dentro do contexto do próprio site. Com isso o atacante pode desviar a sessão do visitante, reescrever a interface exibida e agir em nome dele sem que perceba."
padrao_seguro = "Escapar a saída de acordo com o contexto onde o dado será inserido (texto HTML, atributo ou bloco de script) e nunca inserir entrada do usuário como HTML bruto. Cabeçalhos de política de conteúdo reduzem o impacto, mas não substituem o escape."
referencias = ["CWE-79", "OWASP Cross Site Scripting Prevention Cheat Sheet"]

