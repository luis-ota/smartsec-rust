[[entradas]]
id = "deserializacao_insegura"
classe = "deserializacao_insegura"
cwe = "CWE-502"
titulo = "Desserialização de conteúdo controlado pelo usuário"
descricao = "Formatos que carregam objetos, e não apenas dados, deixam o próprio conteúdo escolher classes e construir instâncias durante a leitura. Um desserializador genérico pode executar código ou abrir conexões antes de a aplicação validar qualquer campo."
padrao_seguro = "Preferir formatos puramente declarativos, como JSON, convertendo depois para tipos conhecidos de forma explícita. Quando o formato binário for indispensável, limitar a leitura a uma lista de classes previstas e conferir o objeto resultante."
referencias = ["CWE-502", "OWASP Deserialization Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
