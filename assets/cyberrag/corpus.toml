if (!hash_equals($_SESSION['csrf_token'], $_POST['csrf_token'] ?? '')) {
    http_response_code(403);
    exit;
}
$usuario = usuario_atual();
$usuario->email = $_POST['email'];
$usuario->save();
echo "Email atualizado";
"""

[[entradas]]
id = "open_redirect"
classe = "open_redirect"
cwe = "CWE-601"
titulo = "Redirecionamento para destino externo informado pelo usuário"
descricao = "A aplicação aceita um destino de redirecionamento vindo de parâmetro e encaminha o visitante para o site indicado, mantendo o domínio confiável na primeira etapa do fluxo. Isso dá credibilidade a páginas de phishing e a formulários falsos de coleta de credenciais."
padrao_seguro = "Usar apenas destinos internos previstos em lista permitida, ou um identificador que o servidor converte no caminho correto, nunca a URL completa recebida. Rejeitar valores absolutos e esquemas externos antes de responder."
referencias = ["CWE-601", "OWASP Unvalidated Redirects and Forwards Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
@app.get("/entrar")
def entrar():
    destino = request.args.get("proximo", "/painel")
    return redirect(destino)
"""
corrigido = """
DESTINOS_PERMITIDOS = {"/painel", "/perfil"}

@app.get("/entrar")
def entrar():
    destino = request.args.get("proximo", "/painel")
    if destino not in DESTINOS_PERMITIDOS:
        destino = "/painel"
    return redirect(destino)
"""

[[entradas.exemplos]]
linguagem = "javascript"
vulneravel = """
app.get("/sair", (req, res) => {
  res.redirect(req.query.proximo);
});
"""
corrigido = """
const DESTINOS_PERMITIDOS = new Set(["/painel", "/entrar"]);

app.get("/sair", (req, res) => {
  const destino = DESTINOS_PERMITIDOS.has(req.query.proximo) ? req.query.proximo : "/painel";
  res.redirect(destino);
});
"""

[[entradas]]
id = "upload_inseguro"
classe = "upload_inseguro"
cwe = "CWE-434"
titulo = "Upload de arquivo executável em área servida"
descricao = "Aceitar o arquivo enviado sem conferir tipo, tamanho e destino permite gravar conteúdo executável dentro da área publicada pela aplicação. Basta que o nome termine em uma extensão interpretada pelo servidor para o arquivo virar código em execução."
padrao_seguro = "Validar tipo e tamanho, renomear o arquivo com identificador gerado pelo servidor e guardá-lo fora da árvore servida diretamente. Se o conteúdo precisar ser público, entregue-o por rota controlada que confere permissão."
referencias = ["CWE-434", "OWASP File Upload Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "php"
vulneravel = """
<?php
$destino = __DIR__ . '/uploads/' . basename($_FILES['arquivo']['name']);
move_uploaded_file($_FILES['arquivo']['tmp_name'], $destino);
echo "Arquivo enviado";
"""
corrigido = """
<?php
$tipos = ['image/png' => 'png', 'image/jpeg' => 'jpg'];
$tipo = mime_content_type($_FILES['arquivo']['tmp_name']);
if (!isset($tipos[$tipo]) || $_FILES['arquivo']['size'] > 2_000_000) {
    http_response_code(400);
    exit;
}
$destino = dirname(__DIR__) . '/armazenamento/' . bin2hex(random_bytes(8)) . '.' . $tipos[$tipo];
move_uploaded_file($_FILES['arquivo']['tmp_name'], $destino);
"""

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
@app.post("/avatar")
def avatar():
    arquivo = request.files["avatar"]
    arquivo.save(os.path.join(PASTA_PUBLICA, arquivo.filename))
    return {"ok": True}
"""
corrigido = """
EXTENSOES = {".png", ".jpg"}

@app.post("/avatar")
def avatar():
    arquivo = request.files["avatar"]
    extensao = os.path.splitext(arquivo.filename)[1].lower()
    if extensao not in EXTENSOES:
        abort(400)
    nome = secrets.token_hex(8) + extensao
    arquivo.save(os.path.join(PASTA_PRIVADA, nome))
    return {"nome": nome}
"""

[[entradas]]
id = "criptografia_fraca"
classe = "criptografia_fraca"
cwe = "CWE-327"
titulo = "Uso de algoritmo criptográfico obsoleto"
descricao = "Algoritmos como MD5, SHA-1 e DES já não oferecem resistência suficiente: colisões e quebras são viáveis com recursos comuns. Senhas protegidas assim caem rápido por tabelas pré-calculadas e por tentativa exaustiva, mesmo que pareçam embaralhadas."
padrao_seguro = "Escolher algoritmo moderno e adequado ao uso: derivação de chave com custo ajustável para senhas (bcrypt, scrypt ou Argon2) e cifra autenticada para dados em repouso. Migrar hashes antigos no próximo login bem-sucedido, sem exigir troca imediata."
referencias = ["CWE-327", "OWASP Password Storage Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
import hashlib

def hash_senha(senha):
    return hashlib.md5(senha.encode()).hexdigest()
"""
corrigido = """
import bcrypt

def hash_senha(senha):
    return bcrypt.hashpw(senha.encode(), bcrypt.gensalt(rounds=12))
"""

[[entradas.exemplos]]
linguagem = "java"
vulneravel = """
MessageDigest digest = MessageDigest.getInstance("SHA-1");
byte[] hash = digest.digest(senha.getBytes(StandardCharsets.UTF_8));
return Base64.getEncoder().encodeToString(hash);
"""
corrigido = """
byte[] sal = new byte[16];
new SecureRandom().nextBytes(sal);
PBEKeySpec spec = new PBEKeySpec(senha.toCharArray(), sal, 210_000, 256);
SecretKeyFactory fabrica = SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256");
byte[] hash = fabrica.generateSecret(spec).getEncoded();
return Base64.getEncoder().encodeToString(sal) + ":" + Base64.getEncoder().encodeToString(hash);
"""

[[entradas]]
id = "autenticacao_fraca"
classe = "autenticacao_fraca"
cwe = "CWE-287"
titulo = "Decisão de acesso baseada em valor controlado pelo cliente"
descricao = "Confiar em cabeçalho, parâmetro de papel ou comparação simples de senha equivale a aceitar a palavra do visitante sobre quem ele é. Fluxos assim cedem acesso indevido sem exigir credencial válida e sem segundo fator para operações sensíveis."
padrao_seguro = "Verificar a credencial no servidor com hash e comparação de tempo constante, derivar o papel sempre da sessão autenticada e exigir segundo fator em ações sensíveis. A resposta de falha deve ser genérica e idêntica para usuário existente ou inexistente."
referencias = ["CWE-287", "OWASP Authentication Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "javascript"
vulneravel = """
app.get("/admin", (req, res) => {
  if (req.headers["x-papel"] === "admin") {
    return res.json({ relatorio: "consolidado-exemplo" });
  }
  res.status(403).end();
});
"""
corrigido = """
app.get("/admin", (req, res) => {
  const sessao = verificaTokenDeSessao(req.cookies.sessao);
  if (!sessao || sessao.papel !== "admin") return res.status(403).end();
  res.json({ relatorio: "consolidado-exemplo" });
});
"""

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
@app.post("/login")
def login():
    usuario = usuarios_por_nome(request.json.get("usuario", ""))
    if usuario is not None and usuario.senha == request.json.get("senha", ""):
        return {"token": emite_token(usuario)}
    return {"erro": "falha no login"}, 401
"""
corrigido = """
@app.post("/login")
def login():
    usuario = usuarios_por_nome(request.json.get("usuario", ""))
    if usuario is None or not bcrypt.checkpw(request.json.get("senha", "").encode(), usuario.senha_hash):
        return {"erro": "credenciais invalidas"}, 401
    if not totp.verifica(usuario.segredo_totp, request.json.get("codigo", "")):
        return {"erro": "credenciais invalidas"}, 401
    return {"token": emite_token(usuario)}
"""

[[entradas]]
id = "sessao_insegura"
classe = "sessao_insegura"
cwe = "CWE-384"
titulo = "Identificador de sessão mantido após o login"
descricao = "Reaproveitar o mesmo identificador de sessão antes e depois da autenticação permite que um valor conhecido pelo atacante passe a valer como sessão autenticada. Cookies sem HttpOnly, Secure e SameSite ampliam a exposição por script ou por conexão sem TLS."
padrao_seguro = "Regenerar o identificador de sessão no login e em toda mudança de privilégio, invalidando o valor anterior, e emitir o cookie com HttpOnly, Secure e SameSite. Definir expiração curta e destruir a sessão de fato no logout."
referencias = ["CWE-384", "OWASP Session Management Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
@app.post("/login")
def login():
    if confere_credenciais(request.form["usuario"], request.form["senha"]):
        session["usuario"] = request.form["usuario"]
        return redirect("/painel")
"""
corrigido = """
@app.post("/login")
def login():
    if confere_credenciais(request.form["usuario"], request.form["senha"]):
        session.clear()
        session["identificador"] = secrets.token_urlsafe(32)
        session["usuario"] = request.form["usuario"]
        return redirect("/painel")
"""

[[entradas.exemplos]]
linguagem = "php"
vulneravel = """
<?php
session_start();
$_SESSION['usuario'] = $_POST['usuario'];
echo "Sessao iniciada para " . $_SESSION['usuario'];
"""
corrigido = """
<?php
session_set_cookie_params(['httponly' => true, 'secure' => true, 'samesite' => 'Lax']);
session_start();
session_regenerate_id(true);
$_SESSION['usuario'] = $_POST['usuario'];
echo "Sessao iniciada";
"""

[[entradas]]
id = "configuracao_insegura"
classe = "configuracao_insegura"
cwe = "CWE-16"
titulo = "Padrão de desenvolvimento mantido em produção"
descricao = "Opções convenientes em desenvolvimento, como modo de depuração ligado, escuta em todas as interfaces e origem de CORS livre, viajam para produção junto com a aplicação. O resultado é superfície extra exposta sem que nenhuma linha de código tenha mudado."
padrao_seguro = "Fixar explicitamente as opções sensíveis: depuração desligada, escuta restrita às interfaces necessárias e lista fechada de origens e métodos em CORS. Tratar configuração como código revisado, versionado e diferente entre ambientes."
referencias = ["CWE-16", "OWASP Security Headers"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
from flask import Flask
from flask_cors import CORS

app = Flask(__name__)
CORS(app, origins="*", supports_credentials=True)

app.run(debug=True, host="0.0.0.0")
"""
corrigido = """
from flask import Flask
from flask_cors import CORS

app = Flask(__name__)
CORS(app, origins=["https://app.exemplo.local"], supports_credentials=True)

app.run(debug=False, host="127.0.0.1")
"""

[[entradas.exemplos]]
linguagem = "javascript"
vulneravel = """
const app = require("express")();

app.set("trust proxy", true);
app.use(require("cors")({ origin: true, credentials: true }));
app.listen(3000);
"""
corrigido = """
const app = require("express")();

app.use(require("cors")({ origin: ["https://app.exemplo.local"], credentials: true }));
app.use(require("helmet")());
app.listen(3000, "127.0.0.1");
"""

[[entradas]]
id = "cabecalho_seguranca_ausente"
classe = "cabecalho_seguranca_ausente"
cwe = "CWE-693"
titulo = "Cabeçalho de segurança HTTP ausente"
descricao = "Sem Content-Security-Policy, HSTS, X-Frame-Options e cabeçalhos equivalentes, o navegador deixa de aplicar proteções que reduziriam o impacto de XSS, clickjacking e downgrade de TLS. A ausência não é um erro de sintaxe: é uma camada de defesa que simplesmente não chega ao cliente."
padrao_seguro = "Definir os cabeçalhos no proxy reverso ou no framework, com CSP restritiva, HSTS em HTTPS, X-Frame-Options ou frame-ancestors, X-Content-Type-Options: nosniff e Referrer-Policy. Tratar a lista como configuração versionada e validada em teste."
referencias = ["CWE-693", "OWASP Secure Headers Project"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
from flask import Flask
app = Flask(__name__)

@app.after_request
def sem_cabecalhos(response):
    return response
"""
corrigido = """
from flask import Flask
app = Flask(__name__)

@app.after_request
def cabecalhos_de_seguranca(response):
    response.headers["Content-Security-Policy"] = "default-src 'self'"
    response.headers["X-Content-Type-Options"] = "nosniff"
    response.headers["X-Frame-Options"] = "DENY"
    response.headers["Referrer-Policy"] = "no-referrer"
    return response
"""

[[entradas.exemplos]]
linguagem = "javascript"
vulneravel = """
const express = require("express");
const app = express();
app.get("/", (_req, res) => res.send("ok"));
app.listen(3000);
"""
corrigido = """
const express = require("express");
const helmet = require("helmet");
const app = express();
app.use(helmet());
app.get("/", (_req, res) => res.send("ok"));
app.listen(3000);
"""

[[entradas]]
id = "divulgacao_por_erro"
classe = "divulgacao_por_erro"
cwe = "CWE-209"
titulo = "Detalhes internos devolvidos na mensagem de erro"
descricao = "Devolver a exceção completa ao cliente entrega nomes de tabelas, caminhos de arquivos e detalhes de infraestrutura que ajudam a planejar o ataque seguinte. O mesmo vale para logs operacionais que guardam dado sensível sem necessidade."
padrao_seguro = "Responder com mensagem genérica acompanhada de um identificador de correlação, registrando o detalhe apenas no log interno, sem segredo nem dado pessoal. Restringir o acesso aos logs a quem precisa deles."
referencias = ["CWE-209", "OWASP Error Handling Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
@app.errorhandler(Exception)
def trata_erro(erro):
    return {"erro": str(erro), "traceback": traceback.format_exc()}, 500
"""
corrigido = """
@app.errorhandler(Exception)
def trata_erro(erro):
    referencia = uuid.uuid4().hex
    app.logger.exception("falha interna na requisicao %s", referencia)
    return {"erro": "erro interno", "referencia": referencia}, 500
"""

[[entradas.exemplos]]
linguagem = "java"
vulneravel = """
try {
    servico.processa(requisicao);
} catch (Exception erro) {
    resposta.setStatus(500);
    resposta.getWriter().write(erro.toString());
}
"""
corrigido = """
try {
    servico.processa(requisicao);
} catch (Exception erro) {
    String referencia = UUID.randomUUID().toString();
    logger.log(Level.SEVERE, "falha interna " + referencia, erro);
    resposta.setStatus(500);
    resposta.getWriter().write("erro interno; referencia " + referencia);
}
"""

[[entradas]]
id = "ssti"
classe = "ssti"
cwe = "CWE-1336"
titulo = "Entrada do usuário interpretada como template"
descricao = "Se a entrada é concatenada ao texto do template, o motor a analisa como parte da linguagem e avalia expressões arbitrárias. Isso expõe variáveis internas e, em muitos casos, permite executar comandos no servidor."
padrao_seguro = "Manter os templates fixos, escritos pelo time, recebendo a entrada somente como dado de contexto. Executar os templates em ambiente de sandbox com autoescape e nunca montar o texto do template em tempo de execução."
referencias = ["CWE-1336", "OWASP Server Side Template Injection"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
from flask import render_template_string

@app.get("/ola")
def ola():
    nome = request.args.get("nome", "")
    return render_template_string("<h1>Ola " + nome + "</h1>")
"""
corrigido = """
from jinja2.sandbox import SandboxedEnvironment

ambiente = SandboxedEnvironment(autoescape=True)

@app.get("/ola")
def ola():
    nome = request.args.get("nome", "")
    return ambiente.from_string("<h1>Ola {{ nome }}</h1>").render(nome=nome)
"""

[[entradas.exemplos]]
linguagem = "javascript"
vulneravel = """
const handlebars = require("handlebars");

app.get("/saudacao", (req, res) => {
  const modelo = handlebars.compile("Ola " + req.query.nome);
  res.send(modelo({}));
});
"""
corrigido = """
const handlebars = require("handlebars");

app.get("/saudacao", (req, res) => {
  const modelo = handlebars.compile("Ola {{nome}}");
  res.send(modelo({ nome: req.query.nome }));
});
"""

[[entradas]]
id = "injecao_ldap"
classe = "injecao_ldap"
cwe = "CWE-90"
titulo = "Filtro LDAP montado por concatenação"
descricao = "Filtros LDAP montados por concatenação deixam caracteres especiais, como asterisco e parênteses, alterar a condição de busca. O atacante amplia resultados, inverte a lógica do filtro e, em alguns fluxos, autentica sem conhecer a senha."
padrao_seguro = "Escapar os caracteres especiais do filtro com a função própria da biblioteca e limitar a entrada aos caracteres esperados no campo. Filtro, base de busca e nome distinto nunca devem vir prontos do cliente."
referencias = ["CWE-90", "OWASP LDAP Injection Prevention Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
def busca(conexao, usuario):
    filtro = "(&(objectClass=person)(uid=" + usuario + "))"
    conexao.search("ou=people,dc=exemplo", filtro)
    return conexao.entries
"""
corrigido = """
from ldap3.utils.conv import escape_filter_chars

def busca(conexao, usuario):
    filtro = "(&(objectClass=person)(uid=" + escape_filter_chars(usuario) + "))"
    conexao.search("ou=people,dc=exemplo", filtro)
    return conexao.entries
"""

[[entradas.exemplos]]
linguagem = "java"
vulneravel = """
String filtro = "(&(objectClass=person)(uid=" + usuario + "))";
NamingEnumeration<SearchResult> resultado =
        contexto.search("ou=people,dc=exemplo", filtro, controles);
return resultado.hasMore() ? resultado.next().getNameInNamespace() : null;
"""
corrigido = """
if (!usuario.matches("[A-Za-z0-9._-]{1,32}")) {
    throw new IllegalArgumentException("usuario invalido");
}
String filtro = "(&(objectClass=person)(uid=" + usuario + "))";
NamingEnumeration<SearchResult> resultado =
        contexto.search("ou=people,dc=exemplo", filtro, controles);
return resultado.hasMore() ? resultado.next().getNameInNamespace() : null;
"""

[[entradas]]
id = "limite_de_taxa_ausente"
classe = "limite_de_taxa_ausente"
cwe = "CWE-770"
titulo = "Ausência de limite de requisições em rota sensível"
descricao = "Sem limite no número de chamadas, rotas como login, envio de mensagem e recuperação de senha podem ser repetidas milhares de vezes. Isso viabiliza força bruta de credenciais, consumo excessivo de recurso e indisponibilidade por esgotamento do serviço."
padrao_seguro = "Aplicar limite por conta e por origem nas rotas sensíveis, com janela deslizante, atraso progressivo e bloqueio temporário depois do excesso. Registrar as tentativas e devolver resposta clara quando o limite for atingido."
referencias = ["CWE-770", "OWASP Denial of Service Cheat Sheet"]

[[entradas.exemplos]]
linguagem = "python"
vulneravel = """
@app.post("/login")
def login():
    return autentica(request.form["usuario"], request.form["senha"])
"""
corrigido = """
limite = Limiter(key_func=get_remote_address)

@app.post("/login")
@limite.limit("5/minute")
def login():
    return autentica(request.form["usuario"], request.form["senha"])
"""

[[entradas.exemplos]]
linguagem = "javascript"
vulneravel = """
app.post("/recuperar-senha", async (req, res) => {
  await enviaEmail(req.body.email);
  res.json({ ok: true });
});
"""
corrigido = """
const rateLimit = require("express-rate-limit");
const limite = rateLimit({ windowMs: 60_000, max: 5 });

app.post("/recuperar-senha", limite, async (req, res) => {
  await enviaEmail(req.body.email);
  res.json({ ok: true });
});
"""

[[entradas]]
id = "dependencia_vulneravel"
classe = "dependencia_vulneravel"
cwe = "CWE-1104"
titulo = "Dependência de biblioteca sem manutenção"
descricao = "Bibliotecas antigas carregam falhas já públicas, e a aplicação passa a expor vulnerabilidades que não aparecem em nenhuma linha escrita no projeto. Versões fixadas sem acompanhamento raramente recebem correção e por vezes ficam anos sem atualização."
padrao_seguro = "Manter as dependências em versões sustentadas, revisar avisos de vulnerabilidade continuamente e automatizar a verificação no pipeline de build. Remover bibliotecas sem uso reduz a superfície que precisa ser atualizada."
referencias = ["CWE-1104", "OWASP Vulnerable and Outdated Components", "OWASP Dependency-Check"]

[[entradas.exemplos]]
linguagem = "java"
vulneravel = """
<dependency>
  <groupId>org.apache.logging.log4j</groupId>
  <artifactId>log4j-core</artifactId>
  <version>2.14.1</version>
</dependency>
"""
corrigido = """
<dependency>
  <groupId>org.apache.logging.log4j</groupId>
  <artifactId>log4j-core</artifactId>
  <version>2.20.0</version>
</dependency>
"""

