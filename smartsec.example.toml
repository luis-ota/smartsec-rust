# SmartSec — exemplo de configuração TOML
#
# Uso: smartsec scan --target <ALVO> --config ./smartsec.example.toml
#
# Regras de precedência:
# - `--target` é sempre obrigatório na CLI (o `target_url` deste arquivo é
#   substituído pelo valor da CLI no modo headless).
# - As demais flags da CLI (`--tools`, `--llm`, `--model`) sobrescrevem o arquivo.
# - `scan` headless sempre opera como Automático, independente de `execution_type`.

target_url = "http://169.254.1.2:3000"
active_tools = ["nmap", "nuclei"]
# Valores: "Auto" | "Assisted". Ausente = "Assisted".
execution_type = "Assisted"

[llm]
# Valores: "LlamaCpp" | "NvidiaNim" | "OpenAI" | "Custom".
# Aceita o rótulo da TUI e as grafias da CLI, sem diferenciar caixa nem
# separadores: "llama.cpp", "openai", "nvidia-nim", "personalizado".
# "ollama" e "Mock" seguem válidos como alias, para configurações já gravadas.
provider = "LlamaCpp"
# Opcionais: quando ausentes, assumem o padrão do provedor.
# O llama-server serve a API compatível com OpenAI na porta 8080 e identifica o
# modelo pelo arquivo GGUF carregado com -m.
base_url = "http://localhost:8080/v1"
model = "Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
# timeout_secs = 45
# max_retries = 2
# remote_consent = false
# fallback_enabled = false

# Opcionais: caminho e commit esperado dos templates do Nuclei.
# nuclei_templates_path = "/home/usuario/nuclei-templates"
# nuclei_templates_commit = "b98e6097cb84e73e7a480436062d685a8f898824"

# Opcionais: destino do relatório Markdown no modo headless.
# As flags --output e --output-dir da CLI têm precedência sobre estes campos.
# output_file = "smartsec-report.md"
# output_dir = "/caminho/para/relatorios"

# Opcional: regra automática de interrupção (REQ05). Interrompe a varredura ao
# atingir a quantidade de vulnerabilidades críticas, e registra o motivo no log
# estruturado. 0 (padrão) mantém a regra desativada.
# A flag --max-critical-findings da CLI tem precedência sobre este campo.
# A avaliação ocorre entre ferramentas, preservando a evidência já coletada.
# max_critical_findings = 3
# Diretorio do projeto analisado pelo agente de codigo (--project).
# Padrao: o diretorio atual. A analise e somente leitura: o SmartSec nao cria,
# altera nem remove nada dentro deste diretorio.
# project_dir = "/caminho/para/minha-aplicacao"

# Ferramentas adicionais registradas por configuração (RNF08).
# O manifesto é validado no carregamento: campos obrigatórios, duplicidade e
# runner/parser precisam ser conhecidos. Runners: "nmap", "nuclei", "generic",
# "repository", "zap". Parsers: "nmap-xml", "nuclei-jsonl", "nikto-json",
# "sqlmap-text", "trufflehog-jsonl", "zap-json", "generic-text".
# O runner "repository" monta o alvo (um repositorio) somente leitura dentro do
# container; o alvo deve ser um caminho absoluto de repositorio ou a URI de um
# repositorio remoto autorizado.
# Nmap, Nuclei, Nikto, SQLMap, TruffleHog e ZAP ja sao embutidos; use outro nome
# aqui para nao duplicar.
# Procedimento completo em docs/EXTENDING_TOOLS.md.
