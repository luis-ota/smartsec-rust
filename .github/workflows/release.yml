# Empacotamento de release do SmartSec.
#
# Dispara em tag `v*`. Cada artefato vai junto de um `SHA256SUMS`, porque o
# binario sai de um repositorio publico e o usuario precisa de uma forma de
# conferir a integridade sem depender do navegador.
#
# `-j 1` em todo comando do cargo pelo mesmo motivo do CI (issue #26): o build
# paralelo estoura a memoria das maquinas do projeto. A linha de comando
# homologada localmente precisa ser a mesma do CI para a evidencia do TCC
# continuar comparavel.
name: SmartSec Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a buildar (ex.: v0.2.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: smartsec-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SMARTSEC_PACOTE_LIBDBUS: 'libdbus-1-dev'
  SMARTSEC_TOOLCHAIN: '1.98.1'

jobs:
  binarios:
    name: Binary ${{ matrix.alvo }}
    runs-on: instabox-medium
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both targets are built inside Ubuntu 22.04 containers to keep the glibc 2.35 baseline.
          - alvo: x86_64-unknown-linux-gnu
            deb: true
          # The aarch64 container runs under QEMU on the AMD64 instabox runner.
          - alvo: aarch64-unknown-linux-gnu
            deb: false
    steps:
      - name: Get code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Build release binary
        run: |
          set -euo pipefail
          platform=linux/amd64
          if [ "${{ matrix.alvo }}" = "aarch64-unknown-linux-gnu" ]; then
            platform=linux/arm64
          fi
          docker run --rm --platform "$platform" \
            -v "$PWD:/work" -w /work \
            ubuntu:22.04 bash -c '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl git build-essential libdbus-1-dev pkg-config
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$2"
              cargo build -j 1 --release --locked --target "$1" --bin smartsec
            ' _ "${{ matrix.alvo }}" "${{ env.SMARTSEC_TOOLCHAIN }}"
          sudo chown -R "$USER:$USER" target
          ls -lh "target/${{ matrix.alvo }}/release/smartsec"

      - name: Verificar o binario gerado
        run: |
          set -euo pipefail
          binario="target/${{ matrix.alvo }}/release/smartsec"
          file "$binario"
          # A release v0.2.1 saiu com o binario reportando 0.2.0 (Cargo.toml
          # sem bump); a tag e o binario precisam contar a mesma versao.
          versao_binario="$("$binario" --version | awk '{print $2}')"
          versao_tag="${{ inputs.tag || github.ref_name }}"
          versao_tag="${versao_tag#v}"
          if [ "$versao_binario" != "$versao_tag" ]; then
            echo "::error::o binario reporta $versao_binario, mas a tag e $versao_tag; atualize a version do Cargo.toml antes de taguear"
            exit 1
          fi
          "$binario" --help

      - name: Empacotar tar.gz
        run: |
          set -euo pipefail
          versao="${{ inputs.tag || github.ref_name }}"
          versao="${versao#v}"
          pacote="smartsec-${versao}-${{ matrix.alvo }}"
          staging="$RUNNER_TEMP/pacote"
          mkdir -p "$staging"
          install -m 0755 "target/${{ matrix.alvo }}/release/smartsec" "$staging/smartsec"
          install -m 0644 README.md "$staging/README.md"
          install -m 0644 docs/INSTALACAO.md "$staging/INSTALACAO.md"
          install -m 0644 assets/fonts/LICENSE "$staging/LICENSE-NOTO-SANS.txt"
          install -m 0755 scripts/install.sh "$staging/install.sh"
          tar -czf "$RUNNER_TEMP/${pacote}.tar.gz" -C "$staging" .
          ls -lh "$RUNNER_TEMP/${pacote}.tar.gz"

      # O `.deb` nao roda codigo de manutencao: sem postinst, sem prerm, sem
      #privileged. Ele empacota o binario em `/usr/bin` e o README em
      # `/usr/share/doc`; o Podman, o `pasta` e os templates continuam sendo
      # responsabilidade do usuario, como no caminho sem `sudo`. Um pacote que
      # mexesse em `/etc/containers` esconderia a configuracao de rootless que o
      # TCC exige ser explicita.
      - name: Empacotar .deb
        if: matrix.deb
        run: |
          set -euo pipefail
          versao="${{ inputs.tag || github.ref_name }}"
          versao="${versao#v}"
          raiz="$RUNNER_TEMP/deb"
          mkdir -p "$raiz/DEBIAN" "$raiz/usr/bin" "$raiz/usr/share/doc/smartsec"
          install -m 0755 "target/${{ matrix.alvo }}/release/smartsec" "$raiz/usr/bin/smartsec"
          install -m 0644 README.md "$raiz/usr/share/doc/smartsec/README.md"
          install -m 0644 docs/INSTALACAO.md "$raiz/usr/share/doc/smartsec/INSTALACAO.md"
          printf 'smartsec (SmartSec - plataforma de analise de seguranca) %s\n' "$versao" >"$raiz/usr/share/doc/smartsec/changelog.Debian"
          cat >"$raiz/DEBIAN/control" <<CONTROL
          Package: smartsec
          Version: $versao
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libc6
          Maintainer: SmartSec TCC <smartsec@example.invalid>
          Homepage: https://github.com/luis-ota/smartsec-rust
          Description: Plataforma de analise de seguranca
           Executa scanners em containers Podman rootless e gera relatorio
           Markdown e PDF. Requer Podman rootless, o backend de rede pasta e os
           templates do Nuclei, que este pacote nao instala.
          CONTROL
          dpkg-deb --build --root-owner-group "$raiz" \
            "$RUNNER_TEMP/smartsec_${versao}_amd64.deb"
          dpkg-deb --info "$RUNNER_TEMP/smartsec_${versao}_amd64.deb"
          dpkg-deb --contents "$RUNNER_TEMP/smartsec_${versao}_amd64.deb"

      # O SHA256SUMS e montado no job de publicacao, sobre os arquivos que
      # serao anexados: um checksum calculado em outra maquina nao valida o
      # artefato que o usuario baixa.

      - name: Publicar os artefatos
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: smartsec-${{ matrix.alvo }}
          path: |
            ${{ runner.temp }}/*.tar.gz
            ${{ runner.temp }}/*.deb
          if-no-files-found: error

  publicar:
    name: Publish release
    needs: binarios
    runs-on: instabox-medium
    timeout-minutes: 20
    steps:
      # O checkout precisa vir ANTES do download: com `clean: true` ele esvazia
      # o workspace e apagaria o diretório `artefatos` recém-baixado.
      - name: Obter o codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Baixar os artefatos
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artefatos
          merge-multiple: true

      # O bootstrap do `curl | sh` e publicado como asset `install.sh`; ele baixa
      # o pacote do alvo certo, confere o SHA256 e delega ao install.sh completo
      # que vem dentro do próprio pacote.
      - name: Preparar o install.sh do curl | sh
        run: install -m 0755 scripts/install-remote.sh install.sh

      # Os checksums e os artefatos vivem em `artefatos/` durante o job; o
      # conteúdo do SHA256SUMS fica com `./nome` para o usuário conferir na
      # pasta onde baixou.
      - name: Calcular os checksums dos artefatos publicados
        run: |
          set -euo pipefail
          cd artefatos
          sha256sum ./*.tar.gz ./*.deb >SHA256SUMS
          cat SHA256SUMS

      - name: Criar a release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          titulo="$TAG"
          {
            printf 'SmartSec %s\n\n' "$TAG"
            printf 'Binario Linux unico, sem dependencia de biblioteca do host alem do Podman rootless.\n\n'
            printf 'Instalacao em um comando (sem sudo):\n\n'
            printf '```sh\n'
            printf 'curl -fsSL https://github.com/luis-ota/smartsec-rust/releases/latest/download/install.sh | sh\n'
            printf '```\n\n'
            printf 'Ou baixe o pacote do seu alvo e rode `./install.sh` (docs/INSTALACAO.md).\n\n'
            printf '| Arquivo | SHA256 |\n|---|---|\n'
            while read -r soma arquivo; do
              printf '| `%s` | `%s` |\n' "${arquivo#./}" "$soma"
            done <artefatos/SHA256SUMS
          } >NOTAS.md
          cat NOTAS.md
          gh release create "$TAG" \
            --title "$titulo" \
            --notes-file NOTAS.md \
            --verify-tag \
            ./install.sh \
            artefatos/*.tar.gz artefatos/*.deb artefatos/SHA256SUMS
