[package]
name = "smartsec-rust"
version = "0.2.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
toml = "0.8"
dirs = "6"
keyring = "3"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1"
arboard = "3"
quick-xml = { version = "0.38", features = ["serialize"] }
